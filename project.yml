name: nobu-ios

options:
  bundleIdPrefix: jp.kechiiiiin
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.40.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  NoBu:
    type: application
    platform: iOS
    sources:
      - path: NoBu
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_NAME: nobu
        PRODUCT_BUNDLE_IDENTIFIER: jp.kechiiiiin.nobu
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # iPhone だけ（iPad / Mac は対象外）
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: NoBu/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # 無料の Personal Team（health-sync・michinori と同じ）
        DEVELOPMENT_TEAM: 7Z4R4TQPZL
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES

  # 画面を実際にタップして確かめる UI テスト（シミュレータ専用）。
  # `make check` / `make resign` では**ビルドされない**（スキームの build に入れていない）。
  # 走らせるのは `make uitest` のときだけ。ローカルの Worker が要る。
  NoBuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NoBuUITests
    dependencies:
      - target: NoBu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.kechiiiiin.nobu.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7Z4R4TQPZL
        TEST_TARGET_NAME: NoBu

# xcodegen が暗黙に作るスキームは xcuserdata（毎回作り直される場所）にしか出ないので、
# 共有スキームを明示する。これが無いと生成直後に `-scheme NoBu` が使えないことがある。
schemes:
  NoBu:
    build:
      targets:
        NoBu: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NoBuUITests
    archive:
      config: Release
